<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geräteliste</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="campus-inner-box">
        <div class="info-group">
            <h4>Logische Netze und Einzelgeräte</h4>

            <div class="vlan-block b-blue">

            </div>
        </div>
    </div>
    <script>
        async function ladeGeraete() {
            try {
                const response = await fetch("http://localhost:8000/api/devices");
                const daten = await response.json()

                const container =
                    document.getElementById("geraete-container");

                container.innerHTML = "";

                daten.forEach(geraet => {

                    const statusClass =
                        geraet.enabled ? "online" : "offline";

                    const statusText =
                        geraet.enabled ? "Aktiv" : "Inaktiv";

                    const html = `
                        <div class="row">
                            <span>${geraet.name}</span>
                            <span class="ip">
                                ${geraet.management_ip}
                            </span>
                            <span class="status ${statusClass}">
                                ${statusText}
                            </span>
                        </div>

                        <div class="pve-node">
                            <strong>CPU:</strong> --
                        </div>

                        <div class="pve-node">
                            <strong>GPU:</strong> --
                        </div>

                        <div class="pve-node">
                            <strong>RAM:</strong> --
                        </div>

                        <div class="pve-node">
                            <strong>Ports:</strong> --
                        </div>

                        <div class="pve-node">
                            <strong>Freie Ports:</strong> --
                        </div>

                        <hr>
                    `;

                    container.innerHTML += html;

                });


            } catch (error) {
                console.error("Fehler beim Laden:", error);
            }
        }

        ladeGeraete();
        setInterval(ladeGeraete, 15000);
    </script>
</body>
</html>
